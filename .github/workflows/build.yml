name: Compila e Pubblica Tabellone

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*' # Si attiva quando crei un tag che inizia con "v" (es. v1.0.0)
  workflow_dispatch:

# Diamo i permessi a GitHub Actions per scrivere nella pagina delle Releases
permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: COMPILAZIONE LINUX
  # ==========================================
  build-linux:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Scarica il codice repository
        uses: actions/checkout@v4

      - name: Installa le dipendenze di sistema Linux
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libpulse-dev

      - name: Installa Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scarica dipendenze Flutter
        run: flutter pub get

      - name: Compila il Telecomando (Web)
        run: flutter build web

      - name: Compila il Tabellone (Linux Desktop)
        run: flutter build linux --release

      - name: Prepara il pacchetto e Zippa
        run: |
          # Copia il web
          mkdir -p build/linux/x64/release/bundle/build/web
          cp -r build/web/* build/linux/x64/release/bundle/build/web/
          
          # Genera certificati SSL
          mkdir -p build/linux/x64/release/bundle/certs
          openssl req -x509 -newkey rsa:4096 -keyout build/linux/x64/release/bundle/certs/key.pem -out build/linux/x64/release/bundle/certs/cert.pem -sha256 -days 365 -nodes -subj "/CN=localhost"
          
          # Rinomina la cartella e crea lo ZIP
          cd build/linux/x64/release/
          mv bundle Tabellone_Linux
          zip -r Tabellone_Linux.zip Tabellone_Linux/

      - name: Carica l'Artefatto Temporaneo
        uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: build/linux/x64/release/Tabellone_Linux.zip
          retention-days: 1


  # ==========================================
  # JOB 2: COMPILAZIONE WINDOWS
  # ==========================================
  build-windows:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Scarica il codice repository
        uses: actions/checkout@v4

      - name: Installa Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scarica dipendenze Flutter
        run: flutter pub get

      - name: Compila il Telecomando (Web)
        run: flutter build web

      - name: Compila il Tabellone (Windows Desktop)
        run: flutter build windows --release

      - name: Prepara il pacchetto e Zippa (PowerShell)
        shell: pwsh
        run: |
          # Copia il web
          New-Item -ItemType Directory -Force -Path build\windows\x64\runner\Release\build\web
          Copy-Item -Path build\web\* -Destination build\windows\x64\runner\Release\build\web\ -Recurse
          
          # Genera certificati SSL
          New-Item -ItemType Directory -Force -Path build\windows\x64\runner\Release\certs
          openssl req -x509 -newkey rsa:4096 -keyout build\windows\x64\runner\Release\certs\key.pem -out build\windows\x64\runner\Release\certs\cert.pem -sha256 -days 365 -nodes -subj "//CN=localhost"
          
          # Rinomina la cartella e crea lo ZIP
          Rename-Item -Path build\windows\x64\runner\Release -NewName Tabellone_Windows
          Compress-Archive -Path build\windows\x64\runner\Tabellone_Windows -DestinationPath Tabellone_Windows.zip

      - name: Carica l'Artefatto Temporaneo
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: Tabellone_Windows.zip
          retention-days: 1


  # ==========================================
  # JOB 3: COMPILAZIONE ANDROID (NUOVO)
  # ==========================================
  build-android:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Scarica il codice repository
        uses: actions/checkout@v4

      # Per Android è necessario configurare Java
      - name: Configura Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installa Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scarica dipendenze Flutter
        run: flutter pub get

      - name: Compila l'App Android (APK)
        run: flutter build apk --release

      - name: Rinomina l'APK
        run: mv build/app/outputs/flutter-apk/app-release.apk Arbitro_Mobile_Android.apk

      - name: Carica l'Artefatto Temporaneo
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Arbitro_Mobile_Android.apk
          retention-days: 1


  # ==========================================
  # JOB 4: PUBBLICAZIONE RELEASE SU GITHUB
  # ==========================================
  create-release:
    needs: [build-linux, build-windows, build-android] # Aspetta che TUTTI E TRE abbiano finito
    runs-on: ubuntu-latest
    # Si avvia SOLO se abbiamo pushato un Tag (es. v1.0.0)
    if: startsWith(github.ref, 'refs/tags/') 
    
    steps:
      - name: Scarica ZIP Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-zip
          
      - name: Scarica ZIP Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-zip

      - name: Scarica APK Android
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          
      - name: Crea la Release Pubblica
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Tabellone_Linux.zip
            Tabellone_Windows.zip
            Arbitro_Mobile_Android.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}